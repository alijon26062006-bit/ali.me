# Полный прод-стек: приложение + Caddy с автоматическим HTTPS.
# Без домена: docker compose up -d          → панель на http://IP:3000, бот на long polling
# С доменом:  docker compose --profile tls up -d → https://ваш-домен и вебхук
services:
  app:
    build: .
    image: kopeyka:latest
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/kopeyka.db
      PORT: "3000"
      NODE_ENV: production
    # На части VPS резолвер хоста недоступен из контейнера — задаём DNS явно,
    # иначе запросы к api.telegram.org падают с EAI_AGAIN / fetch failed.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - kopeyka-data:/data
    # Порт наружу не публикуется: с доменом к приложению ходит только Caddy
    # по внутренней сети. Без домена deploy.sh создаёт docker-compose.override.yml
    # с публикацией порта — так обновление не спотыкается о занятый порт.
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s

  caddy:
    image: caddy:2-alpine
    profiles: ["tls"]
    restart: unless-stopped
    depends_on: [app]
    environment:
      DOMAIN: ${DOMAIN:-}
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  kopeyka-data:
  caddy-data:
  caddy-config:
